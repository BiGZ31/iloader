<?xml version="1.0" encoding="UTF-8"?>
<!-- fucksubs logo (replaces the original iloader branding). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4da3ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#2b6fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2b6fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="220" fill="url(#glow)"/>
  <g transform="translate(512 300)" fill="none" stroke="url(#accent)" stroke-width="54"
     stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-120" x2="0" y2="150"/>
    <polyline points="-130,30 0,160 130,30"/>
    <line x1="-170" y1="250" x2="170" y2="250"/>
  </g>
  <g fill="#f2f5ff" font-family="-apple-system, Helvetica, Arial, sans-serif"
     font-weight="800" text-anchor="middle">
    <text x="512" y="820" font-size="320" letter-spacing="-8">FS</text>
  </g>
</svg>
